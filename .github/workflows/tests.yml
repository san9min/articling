name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # articling's capture code falls back to DejaVu Sans for text
      # rendering when no closer font match is found locally (see
      # articling/capture/xlsx_capture.py); install it explicitly so CI
      # doesn't depend on whatever happens to ship in the runner image.
      - name: Install fonts used by capture rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install articling (core + dev)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
